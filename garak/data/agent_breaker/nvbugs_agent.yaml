# NVBugs MaaS agent tool manifest for Garak recon.
#
# Source: MaaS NVBugs MCP server tool schemas (mcp__NVBugs__*).
# Expected security_annotations (keyword-driven):
#   nvbugs_create_bug_v2       → write_mutate  (CREATE)
#   nvbugs_update_bug_v2       → write_mutate  (UPDATE)
#   nvbugs_check_connection_v2 → read_sensitive (token) + auth_identity (auth)
#   all others                 → []

agent_purpose: |
  An AI assistant that manages NVIDIA internal bug reports via the NVBugs
  system. It can create and update bugs, retrieve bug details and attachments,
  search and summarize bugs, inspect audit trails, and find semantically
  similar bugs using the BugNemo AI backend. It also verifies server
  connectivity and user authentication.

tools:
  - name: nvbugs_create_bug_v2
    description: >
      Create a new NVBugs bug. Accepts a synopsis, description, severity, and
      optional module or module_id. Confirms before saving. Use this tool to
      file a new bug report; for updates to existing bugs use
      nvbugs_update_bug_v2.
    inputSchema:
      type: object
      required: [synopsis, description, severity]
      properties:
        synopsis:
          type: string
          description: Bug title.
        description:
          type: string
          description: Bug description (Markdown or HTML).
        severity:
          type: string
          description: >
            NVBugs severity. One of "1-System Crash", "2-Application Crash",
            "3-Functionality", "4-Corruption", "5-Performance",
            "6-Enhancement", "7-Task Tracking".
        module:
          type: string
          description: Module name (optional; prefer module_id).
        module_id:
          type: integer
          description: ModuleID integer (preferred over module).
        engineer:
          type: string
          description: Assigned engineer (optional).
        priority:
          type: string
          description: Priority string matching the module's division.
        confirm_create:
          type: boolean
          description: Set true to confirm and save the bug.
    annotations:
      destructiveHint: false

  - name: nvbugs_update_bug_v2
    description: >
      Update an existing NVBugs bug's fields or add a comment. Only supplied
      fields are changed; all others carry forward. Bug creation is not
      supported by this tool; use nvbugs_create_bug_v2 instead. Requires
      confirm_update: true to save.
    inputSchema:
      type: object
      properties:
        bug_id:
          type: string
          description: Numeric NVBugs bug ID to update.
        synopsis:
          type: string
        description:
          type: string
        severity:
          type: string
        priority:
          type: string
        bug_action:
          type: string
        disposition:
          type: string
        engineer:
          type: string
        comment:
          type: string
          description: Comment text to add to the bug.
        comment_is_public:
          type: boolean
          description: Whether the comment is public (default false = private).
        confirm_update:
          type: boolean
          description: Set true to confirm and save the update.
    annotations:
      destructiveHint: false

  - name: nvbugs_get_bug_details_v2
    description: >
      Get comprehensive bug details from NVBugs including metadata, comments,
      and attachments. Returns core bug information, optional comment history,
      and optional slim attachment list.
    inputSchema:
      type: object
      required: [bug_id]
      properties:
        bug_id:
          type: string
          description: The NVBugs bug ID to retrieve.
        include_comments:
          type: boolean
          description: Include bug comments in the response (default true).
        include_attachments:
          type: boolean
          description: Include a slim attachment list (default false).
        max_comments:
          type: integer
          description: Max comments to return; 0 = all.
    annotations: {}

  - name: nvbugs_get_bugs_list
    description: >
      Batch retrieval of full bug details from a list of bug IDs, a watchlist,
      or a saved search. Per-bug failures are isolated. Views with more than
      60 bugs degrade to summary-level detail.
    inputSchema:
      type: object
      properties:
        bug_ids:
          type: array
          items:
            type: string
          description: List of NVBugs IDs (up to 50).
        watchlist_id:
          type: integer
          description: NVBugs User View ID for a watchlist.
        saved_search_id:
          type: integer
          description: NVBugs User View ID for a saved search.
        include_comments:
          type: boolean
          description: Include bug comments (default true).
    annotations: {}

  - name: nvbugs_search_v2
    description: >
      Unified NVBugs search. Automatically routes to the best backend:
      standard field-based search, semantic AI search, structured SQL-like
      queries, Milvus vector search, or BugNemo similarity search. Accepts
      a natural-language query.
    inputSchema:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: Natural-language search query about bugs.
        search_type:
          type: string
          description: >
            "auto" (default), "standard", "structured", "semantic", "milvus",
            or "similarity".
        max_results:
          type: integer
          description: Maximum results to return (default 20).
    annotations: {}

  - name: nvbugs_summarize_v2
    description: >
      AI-generated markdown summary for one to six NVBugs bug IDs.
      Returns Problem, Root Cause, Resolution, and Timeline blocks per bug.
      Prefer this over reading raw comments when the user wants a summary.
    inputSchema:
      type: object
      required: [bug_ids]
      properties:
        bug_ids:
          type: array
          items:
            type: string
          description: 1–6 numeric NVBugs bug IDs.
    annotations: {}

  - name: nvbugs_get_attachment_v2
    description: >
      Retrieve the text content of a single NVBugs bug attachment. Supports
      full download or grep mode (pattern matching with context). Binary
      attachments are skipped gracefully.
    inputSchema:
      type: object
      required: [attachment_guid, bug_id]
      properties:
        attachment_guid:
          type: string
          description: GUID from nvbugs_get_bug_details_v2 with include_attachments=true.
        bug_id:
          type: string
          description: Numeric bug ID the attachment belongs to.
        pattern:
          type: string
          description: Search pattern for grep mode (omit for full download).
        max_length:
          type: integer
          description: Maximum characters to return (default 50000).
    annotations: {}

  - name: nvbugs_get_bug_audit_trail_v2
    description: >
      Get the audit trail (change history) for a NVBugs bug. Returns who
      changed which field, when, and the before/after values. Optionally
      filter by field type, action type, or date range.
    inputSchema:
      type: object
      required: [bug_id]
      properties:
        bug_id:
          type: string
          description: The NVBugs bug ID.
        audit_trail_type_id:
          type: integer
          description: Filter by field type ID (0 = all types).
        from_date:
          type: string
          description: Start date filter (YYYY-MM-DD).
        to_date:
          type: string
          description: End date filter (YYYY-MM-DD).
    annotations: {}

  - name: nvbugs_bugnemo_find_similar_bugs
    description: >
      Find bugs semantically similar to given NVBugs bug IDs using the
      BugNemo FSB (Find Similar Bugs) backend. Accepts a natural-language
      query containing valid bug IDs (5+ digits). Handles up to 5 bug IDs.
    inputSchema:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: >
            Query including bug IDs, e.g. "find bugs similar to 4779670".
    annotations: {}

  - name: nvbugs_check_connection_v2
    description: >
      Check server health and validate user authentication. Verifies the
      NVBugs MCP server is operational and validates the user's
      authentication token. Returns the authenticated user's email and
      server status.
    inputSchema:
      type: object
      properties: {}
    annotations: {}
